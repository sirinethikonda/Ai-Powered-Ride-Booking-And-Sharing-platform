server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ai-ride-platform
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rideapp_db}
    username: ${POSTGRES_USER:rideapp_user}
    password: ${POSTGRES_PASSWORD:rideapp_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: RideAppHikariCP

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ride-platform-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.rideapp.*"

app:
  jwt:
    secret: ${JWT_SECRET:VerySecretJwtKeyForSigningTokensMustBeAtLeast256BitsLongRideBookingPlatform2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  dispatch:
    offer-timeout-seconds: 30
    max-replacement-attempts: 3
    search-radius-km: 5.0
  shared-ride:
    max-detour-percentage: 30.0
    shared-discount-factor: 0.70 # 30% discount off solo fare if matched

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      routingService:
        sliding-window-size: 10
        failure-rate-threshold: 60.0
        wait-duration-in-open-state: 5000ms

  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.rideapp.resilience.exception.PaymentNetworkException

  timelimiter:
    instances:
      paymentGateway:
        timeout-duration: 3000ms
        cancel-running-future: true

  ratelimiter:
    instances:
      paymentGateway:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 500ms

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
